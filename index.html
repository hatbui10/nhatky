<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Cá Nhân - Cloud</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        h2 { color: var(--accent); text-align: center; font-size: 1.2rem; margin: 20px 0; letter-spacing: 2px; }
        
        .header-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        input[type="date"] { background: #0f172a; color: white; border: 1px solid var(--border); padding: 8px; border-radius: 6px; outline: none; font-size: 14px; }

        .write-area { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        textarea { width: 100%; height: 300px; background: transparent; border: none; color: var(--text); font-size: 16px; line-height: 1.6; resize: none; outline: none; font-family: inherit; }
        
        .status { font-size: 11px; color: #94a3b8; margin-top: 10px; text-align: right; }
        .btn-save { background: var(--accent); color: #0f172a; font-weight: bold; width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .btn-save:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <h2>DAILY DIARY</h2>

        <div class="header-box">
            <span>📅 Chọn ngày:</span>
            <input type="date" id="date-picker">
        </div>

        <div class="write-area">
            <textarea id="content" placeholder="Hôm nay của bạn thế nào?"></textarea>
            <div id="msg" class="status">Đang đợi bạn viết...</div>
        </div>

        <button class="btn-save" onclick="save()">LƯU VÀO ĐÁM MÂY</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // DÙNG CHUNG CONFIG VỚI SƠ ĐỒ CUỘC ĐỜI
        const firebaseConfig = {
            apiKey: "AIzaSyD1ddvaaA4iQcTwEnvg0havIt6RsxcBkN4",
            authDomain: "sodocuocdoi.firebaseapp.com",
            projectId: "sodocuocdoi",
            storageBucket: "sodocuocdoi.firebasestorage.app",
            messagingSenderId: "343754660099",
            appId: "1:343754660099:web:c916d3f1429a30b643136"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dateEl = document.getElementById('date-picker');
        const textEl = document.getElementById('content');
        const msgEl = document.getElementById('msg');

        // Lấy ngày hiện tại
        const today = new Date().toISOString().split('T')[0];
        dateEl.value = today;

        // Hàm tải nhật ký (Dùng Collection "MyDiary" để không lẫn với Sơ đồ)
        async function load(date) {
            msgEl.innerText = "Đang kiểm tra dữ liệu...";
            try {
                const s = await getDoc(doc(db, "MyDiary", date));
                textEl.value = s.exists() ? s.data().t : "";
                msgEl.innerText = s.exists() ? "Đã tải nội dung ngày " + date : "Ngày này chưa có nhật ký.";
            } catch (e) {
                msgEl.innerText = "Lỗi tải dữ liệu!";
            }
        }

        dateEl.addEventListener('change', (e) => load(e.target.value));

        window.save = async () => {
            const date = dateEl.value;
            const val = textEl.value;
            msgEl.innerText = "Đang lưu...";
            try {
                // Lưu vào Collection "MyDiary"
                await setDoc(doc(db, "MyDiary", date), { t: val, time: new Date().getTime() });
                msgEl.innerText = "Đã lưu thành công lúc " + new Date().toLocaleTimeString();
            } catch (e) {
                alert("Lỗi lưu! Hãy chắc chắn Rules là 'if true'");
            }
        };

        load(today);
    </script>
</body>
</html>
